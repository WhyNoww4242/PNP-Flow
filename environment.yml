# pnpflow solver environment (Windows via WSL, Linux, macOS).
#   conda env create -f environment.yml      (or: mamba / micromamba)
#   conda activate pnpflow
# The desktop app creates this env on first run if it is missing.
#
# Notes
# - gmsh comes from conda-forge, so no system libGLU is needed.
# - pypardiso needs Intel MKL (x86_64 only). On Apple Silicon it is skipped
#   and the solver falls back to SciPy's SuperLU (slower, same answers).
# - GPU (Linux + NVIDIA): after creating the env run
#     pip install -U "jax[cuda12]"
# - LaTeX figures (text.usetex) need a TeX install (TeX Live / MiKTeX / MacTeX).
#   Without one, plots fall back to matplotlib mathtext with a Times-like font.
name: pnpflow
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - scipy
  - matplotlib
  - meshio
  - gmsh
  - python-gmsh
  - cmasher
  - pyyaml
  - pip
  - pip:
      - jax
      - pypardiso; platform_machine == "x86_64" or platform_machine == "AMD64"
      - mcp
